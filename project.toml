# What odin-glib is and needs: build is what a program on it needs, test what only its own
# tests and checks need. house-rules docs/PROJECT_TOML.md has the layout.
[project]
schema = "amber-project-1"
name = "odin-glib"
license = "LGPL-2.1-or-later"
kind = "binding"
summary = "Odin bindings for GLib, GObject and GIO, generated with runic"
tags = [
  "ai-assisted",
  "bindings",
  "glib",
  "linux",
  "odin",
  "runic",
]
collection = "glib"

[build]
packages = [
  "libglib2.0-dev",
  "glib-networking",
]
lib = [
  "glib",
  "gobject",
  "gio",
]

[test]
packages = [
  "shellcheck",
  "shfmt",
]
